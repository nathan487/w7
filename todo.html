<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JavaScript Todo 列表基础版">
  <title>Todo 列表基础版</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <main class="todo-app">
    <h1>我的待办事项</h1>
    <p class="intro">记录今天需要完成的学习任务。</p>

    <div class="todo-entry">
      <label for="todo-input">新增待办：</label>
      <input id="todo-input" type="text" placeholder="例如：完成 JavaScript 练习">
      <button id="add-btn" type="button">添加</button>
    </div>

    <p id="todo-status" aria-live="polite">当前还没有待办事项。</p>
    <ul id="todo-list" aria-label="待办事项列表"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
