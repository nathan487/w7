<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数据驱动的 Todo 列表">
  <title>Todo V2.0</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <main class="todo-app">
    <header class="todo-app__header">
      <p class="todo-app__eyebrow">TODO V2.0</p>
      <h1>我的待办事项</h1>
      <p>任务状态由数组统一管理，刷新后仍会保留。</p>
    </header>

    <section class="todo-app__controls" aria-label="添加待办事项">
      <label for="todo-input">新增待办：</label>
      <div class="todo-app__input-row">
        <input id="todo-input" type="text" placeholder="例如：完成数据驱动重构">
        <button id="add-btn" type="button">添加</button>
      </div>
      <p id="todo-status" aria-live="polite">当前还没有待办事项。</p>
    </section>

    <section class="todo-app__tasks" aria-labelledby="task-list-title">
      <h2 id="task-list-title">任务列表</h2>
      <ul id="todo-list" aria-label="待办事项列表"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
